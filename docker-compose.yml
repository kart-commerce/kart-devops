      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity: { condition: service_started }

  user:
    build:
      context: ..
      dockerfile: kart-user-service/Dockerfile
    container_name: kart-user
