# Full local-dev platform stack: every real (non-stub) kart-*-service, the api-gateway, both
# Angular apps, and the shared infra they need -- one shared Postgres/Mongo/Redis/RabbitMQ/
# OpenSearch instead of each service's own per-repo compose file's separate containers (those
# collide on host ports if run side-by-side; see scripts/README or kart-platform's own
# investigation for the full inventory). This is the FAST inner dev loop -- see
# kart-infra/docs/adr/0001-local-cluster-tool-kind.md for the separate, heavier kind+Helm path
# that actually validates a real Kubernetes deployment. Both are intentional; they serve
# different jobs (README.md explains the split).
#
# Excludes 4 stub services with no code yet (review, shipping, recommendation, analytics)
# -- add them here once they're actually scaffolded. kart-admin-service was scaffolded and
# added below.
#
# Usage: scripts/dev-up.sh (generates compose/globalconfig/ on first run, then `docker compose up`)
#
# Every host port below is `${..._PORT}` interpolated from ports.env -- the single source of
# truth README.md's Ports table and every other file that needs one of these values (each
# service's own launchSettings.json/appsettings.Development.json/docker-compose.yml,
# kart-web's/kart-admin-web's .env.example/proxy.conf.json/app-config.ts) is documented as
# mirroring. scripts/dev-up.sh/dev-down.sh/dev-logs.sh already pass `--env-file ports.env`;
# run `docker compose --env-file ports.env <command>` directly if you're not using those scripts.

services:
  # ---------------------------------------------------------------------------
  # Shared infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kart-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT}:5432" # 5432 is commonly already taken by a local Postgres install
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: kart-mongo
    ports:
      - "${MONGO_PORT}:27017" # 27017 is commonly already taken by a local Mongo install
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kart-redis
    ports:
      - "${REDIS_PORT}:6379" # 6379 is commonly already taken by a local Redis install
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kart
      RABBITMQ_DEFAULT_PASS: kart123
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672" # AMQP - 5672 is commonly already taken
      - "${RABBITMQ_UI_PORT}:15672"  # management UI - http://localhost:15672 (kart/kart123)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: kart-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9200'"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------------
  # Backend services (13 real, scaffolded services -- 5 stubs intentionally excluded)
  # ---------------------------------------------------------------------------
  identity:
    build:
      context: ../kart-identity-service
    container_name: kart-identity
    ports:
      - "${IDENTITY_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GlobalConfig__Path: /app/globalconfig.json
      Observability__Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ./compose/globalconfig/global.json:/app/globalconfig.json:ro
      - ./compose/globalconfig/logs/identity:/var/log/kart/kart-identity-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  category:
