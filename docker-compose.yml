      identity: { condition: service_started }

  cart:
    build:
      context: ..
      dockerfile: kart-cart-service/Dockerfile
    container_name: kart-cart
    ports:
      - "${CART_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GlobalConfig__Path: /app/globalconfig.json
      Observability__Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ${GLOBALCONFIG_PATH}:/app/globalconfig.json:ro
      - ../kart-internals/logs/cart:/var/log/kart/kart-cart-service
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      inventory: { condition: service_started }
      identity: { condition: service_started }

  order:
    build:
      context: ../kart-order-service
    container_name: kart-order
    ports:
      - "${ORDER_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GlobalConfig__Path: /app/globalconfig.json
