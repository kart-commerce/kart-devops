    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka: { condition: service_healthy }
      identity: { condition: service_started }
      order: { condition: service_started }
      product: { condition: service_started }
      inventory: { condition: service_started }

  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ../kart-api-gateway
    container_name: kart-gateway
    ports:
      - "${GATEWAY_PORT}:8080" # 8080 is commonly already taken by something else on a dev box
    environment:
      # Every other container's ASPNETCORE_ENVIRONMENT=Development is masked by its own mounted
      # GlobalConfig file (layered in last - see compose/globalconfig/global.json.example's header comment)
      # overriding appsettings.Development.json's bare-metal `localhost` addresses back to Docker
      # DNS names. The gateway has no GlobalConfig file at all (it holds no secrets), so
      # "Development" here would make it load appsettings.Development.json's Identity:JwksUri AND
      # every ReverseProxy Cluster destination as `localhost:<port>` - unreachable from inside its
      # own container, failing every request (auth first, then every proxied call). Program.cs
      # has no IsDevelopment()-gated behavior (no Swagger here), so this name only controls which
      # appsettings.*.json layers in - anything other than "Development" leaves appsettings.json's
      # own correct `http://<service>:8080/` defaults in effect.
      ASPNETCORE_ENVIRONMENT: Docker
      Observability__Otlp__Endpoint: http://otel-collector:4317
    depends_on:
      identity: { condition: service_started }
      category: { condition: service_started }
      user: { condition: service_started }
      product: { condition: service_started }
      search: { condition: service_started }
      inventory: { condition: service_started }
      cart: { condition: service_started }
      order: { condition: service_started }
      payment: { condition: service_started }
      offer: { condition: service_started }
      wishlist: { condition: service_started }
      delivery-tracking: { condition: service_started }
      admin: { condition: service_started }

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../kart-web
    container_name: kart-web
    ports:
      - "${WEB_PORT}:4000" # 4200 is commonly already taken by a local `ng serve`
    environment:
      PORT: 4000
      NODE_ENV: production
      GATEWAY_BASE_URL: http://gateway:8080
      IDENTITY_SERVICE_BASE_URL: http://identity:8080
      # Browser-reachable — used only for redirect Location headers (e.g. social login), never
      # for this process's own server-to-server calls. Docker-internal hostnames like
      # IDENTITY_SERVICE_BASE_URL above are unreachable from the end user's own browser.
      IDENTITY_SERVICE_PUBLIC_BASE_URL: http://localhost:${IDENTITY_PORT}
      REDIS_URL: redis://redis:6379
      # @angular/ssr's built-in SSRF guard rejects a Host header it doesn't recognize -- it
      # checks the hostname only (port stripped), so this is "localhost", not "localhost:4210".
      NG_ALLOWED_HOSTS: "localhost"
    depends_on:
      gateway: { condition: service_started }
      redis: { condition: service_healthy }

  admin-web:
    build:
      context: ../kart-admin-web
    container_name: kart-admin-web
    ports:
      - "${ADMIN_WEB_PORT}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      GATEWAY_BASE_URL: http://gateway:8080
      IDENTITY_SERVICE_BASE_URL: http://identity:8080
      REDIS_URL: redis://redis:6379
      ADMIN_SERVICE_BASE_URL: http://admin:8080
      # ANALYTICS_SERVICE_BASE_URL intentionally left unset -- kart-analytics-service is still
      # an unscaffolded stub (no code yet). admin-web's own BFF already turns an unreachable
      # upstream into a clean 502 "upstream_unavailable" response, so its analytics panel will
      # correctly show as unavailable until that service is actually built.
      # Without this, logger.ts (kart-admin-web/src/server/logger.ts) falls back to
      # ./logs/bff-server.log relative to /app -- a path that only exists inside the
      # container's own ephemeral filesystem, so it's invisible on the host and lost on
      # every restart. Point it at the same kart-internals/kart-admin-web/bff-server.log
      # file local (non-docker) `npm run serve:bff` already writes to (.env.example), via
      # the bind mount below, so both places land in one file regardless of how the BFF runs.
      LOG_FILE_PATH: /var/log/kart/admin-web/bff-server.log
    volumes:
      - ../kart-internals/kart-admin-web:/var/log/kart/admin-web
    depends_on:
      gateway: { condition: service_started }
      redis: { condition: service_healthy }
      admin: { condition: service_started }

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
  opensearch-data:

# Every service above sets Observability:Otlp:Endpoint to http://otel-collector:4317, but
# otel-collector lives in docker-compose.observability.yml -- a SEPARATE Compose project with
# its own default network. Without this, that hostname never resolves (confirmed the hard way
# 2026-08-14: DNS failure, and even a direct container-IP connection times out -- Compose's
# per-project bridge networks are mutually isolated, not just unaware of each other's DNS), so
# every service's logs/traces/metrics silently never leave the container. `external: true`
# means this network must already exist -- scripts/dev-up.sh and scripts/observability/up.sh
# both create it idempotently before either `docker compose up` runs, so ordering doesn't matter
# regardless of which stack starts first.
networks:
  default:
    name: kart-shared-net
    external: true
