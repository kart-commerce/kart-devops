# Full local-dev platform stack: every real (non-stub) kart-*-service, the api-gateway, both
# Angular apps, and the shared infra they need -- one shared Postgres/Mongo/Redis/RabbitMQ/
# OpenSearch instead of each service's own per-repo compose file's separate containers (those
# collide on host ports if run side-by-side; see scripts/README or kart-platform's own
# investigation for the full inventory). This is the FAST inner dev loop -- see
# kart-infra/docs/adr/0001-local-cluster-tool-kind.md for the separate, heavier kind+Helm path
# that actually validates a real Kubernetes deployment. Both are intentional; they serve
# different jobs (README.md explains the split).
#
# Excludes 3 stub services with no code yet (review, shipping, analytics) -- add them here once
# they're actually scaffolded. kart-admin-service and kart-recommendation-service were scaffolded
# and added below.
#
# Usage: scripts/dev-up.sh (checks globalconfig.local.env resolves to a real file, then
# `docker compose up`)
#
# Every host port below is `${..._PORT}` interpolated from ports.env -- the single source of
# truth README.md's Ports table and every other file that needs one of these values (each
# service's own launchSettings.json/appsettings.Development.json/docker-compose.yml,
# kart-web's/kart-admin-web's .env.example/proxy.conf.json/app-config.ts) is documented as
# mirroring. Every `${GLOBALCONFIG_PATH}` volume entry below comes from globalconfig.local.env
# (gitignored, per-machine -- see globalconfig.local.env.example) instead, so this file never
# records where any developer's real GlobalConfig JSON actually lives. The shared postgres/
# rabbitmq containers' own bootstrap credentials (`${POSTGRES_USER}` etc.) come the same way
# from infra.env (gitignored -- see infra.env.example) instead of being written here in plain
# text. scripts/dev-up.sh/dev-down.sh/dev-logs.sh already pass all three as `--env-file`; run
# `docker compose --env-file ports.env --env-file globalconfig.local.env --env-file infra.env
# <command>` directly if you're not using those scripts.

services:
  # ---------------------------------------------------------------------------
  # Shared infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kart-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432" # 5432 is commonly already taken by a local Postgres install
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: kart-mongo
    ports:
      - "${MONGO_PORT}:27017" # 27017 is commonly already taken by a local Mongo install
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kart-redis
    ports:
      - "${REDIS_PORT}:6379" # 6379 is commonly already taken by a local Redis install
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672" # AMQP - 5672 is commonly already taken
      - "${RABBITMQ_UI_PORT}:15672"  # management UI - http://localhost:15672 (creds in infra.env)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: kart-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9200'"]
      interval: 10s
      timeout: 5s
      retries: 15

  # kart-recommendation-service's own consumed input (design-decisions.md's split-transport
  # decision: OrderDelivered/ProductCreated stay on the shared RabbitMQ above, clickstream moves
  # to Kafka) - single-node KRaft mode, no Zookeeper needed. First Kafka usage on the platform;
  # add a second consumer group here (e.g. Analytics' own full fan-in, ADR-0004) if/when that
  # service is scaffolded, rather than standing up a second broker.
  kafka:
    image: apache/kafka:3.8.0
    container_name: kart-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "R2VuZXJhdGVkQ2x1c3Rlcklk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ---------------------------------------------------------------------------
  # Backend services (14 real, scaffolded services -- 4 stubs intentionally excluded)
  # ---------------------------------------------------------------------------
  identity:
    build:
      context: ../kart-identity-service
    container_name: kart-identity
    ports:
      - "${IDENTITY_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GlobalConfig__Path: /app/globalconfig.json
      Observability__Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ${GLOBALCONFIG_PATH}:/app/globalconfig.json:ro
      - ../kart-internals/logs/identity:/var/log/kart/kart-identity-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  category:
