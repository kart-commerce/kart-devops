name: Docker Build & Push (Reusable)

# Reusable workflow that builds a calling repo's multi-stage Dockerfile and pushes it to GitHub
# Container Registry (ghcr.io) - no extra registry account needed beyond the repo's own GITHUB_TOKEN.
# Implements PLATFORM_BLUEPRINT.md's Quality Gate table (S11) "Docker Build Success" gate (multi-stage
# build succeeds) and feeds "CI/CD Success" (all prior gates green) by only publishing an image once
# the calling repo's own dotnet-service-ci.yml/angular-app-ci.yml smoke-build has already passed in the
# same workflow run. On pull-request branches this workflow still builds (a second smoke check, e.g.
# for platforms/build-args the caller's own CI job doesn't exercise) but never pushes; only a push to
# the repo's default branch publishes `:latest` and the git-SHA tag, matching how dotnet-service-ci.yml
# already restricts itself to a smoke build with no publish step.

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name, without registry/owner prefix (e.g. kart-category-service)."
        required: true
        type: string
      dockerfile-path:
        description: "Path to the Dockerfile, relative to the repo root."
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context, relative to the repo root."
        required: false
        type: string
        default: "."
    outputs:
      image-ref:
        description: "Fully-qualified image reference that was built (SHA-tagged)."
        value: ${{ jobs.build-push.outputs.image-ref }}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.vars.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image vars
        id: vars
        run: |
          registry_image="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}"
          echo "registry-image=${registry_image}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${registry_image}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "is-default-branch=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.vars.outputs.is-default-branch == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs only smoke-build (mirrors dotnet-service-ci.yml's `run-docker-build` smoke check) - the
      # default branch additionally pushes `:latest` and the immutable `:<git-sha>` tag so a deploy
      # can pin to an exact, reproducible image rather than a floating tag.
      - name: Build (and push on default branch only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile-path }}
          push: ${{ steps.vars.outputs.is-default-branch == 'true' }}
          tags: |
            ${{ steps.vars.outputs.registry-image }}:latest
            ${{ steps.vars.outputs.registry-image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
