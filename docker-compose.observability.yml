# Shared local-dev observability stack: Grafana + Loki + Tempo + Prometheus + an OpenTelemetry
# Collector (agent-reusables/docs/standards/observability-standards.md, "Local Development": "The full
# stack ... runs locally via a single shared docker-compose profile, so a developer gets working
# logs/traces/metrics on their machine without touching a shared staging/production Grafana instance.
# The compose file is owned once, centrally [in kart-devops], and referenced by every service - never
# copy-pasted per repo."). This is the local-dev equivalent only - kart-infra owns the real
# Helm-deployed LGTM stack for staging/production (PLATFORM_BLUEPRINT.md S2.4).
#
# Usage from any service repo (see observability/README.md for full details):
#   docker compose -f <path-to-kart-devops>/docker-compose.observability.yml up -d
#
# Then point the service's OTLP exporter at the collector (grpc: localhost:4317, http: localhost:4318)
# and open Grafana at http://localhost:3000 (default login admin/admin).
#
# `name:` below is load-bearing, not decorative: without an explicit project name, Compose
# infers one from the current directory -- which, run from this repo's own root (exactly what
# scripts/observability/*.sh do), collides with docker-compose.yml's own inferred project name
# ("kart-devops"). `docker compose down` tears down its ENTIRE inferred project, not just the
# services listed in the file you pointed it at -- so an unnamed `down -f
# docker-compose.observability.yml` from this directory silently takes the whole main stack
# (all 18 business services + Postgres/Mongo/Redis/RabbitMQ/OpenSearch) down with it. Confirmed
# the hard way while building scripts/observability/ (2026-08-14) -- data volumes survived
# (down without -v never touches them) but every container had to be recreated. This `name:`
# makes the two stacks' projects permanently distinct regardless of which directory a command
# happens to be run from.
name: kart-observability

services:
  grafana:
    image: grafana/grafana:13.1.1
    container_name: observability-grafana
    ports:
      - "3000:3000" # Grafana UI - http://localhost:3000, default login admin/admin
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Grafana's own SQLite DB (dashboards, users, orgs, everything not provisioned from the
      # read-only mount above) lives at /var/lib/grafana/grafana.db. Without a volume here it's
      # just a layer in the container's own filesystem -- gone the instant the container is
      # recreated (`docker compose up` after any config/image change, not just an explicit `down`
      # -- confirmed the hard way 2026-08-14: an unrelated network config change recreated this
      # container and every UI-built dashboard vanished with no warning). This volume alone
      # survives any number of restarts/recreates; it only dies on `down -v` or `docker volume rm`.
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus

  loki:
    image: grafana/loki:3.6.13
    container_name: observability-loki
    ports:
      - "3100:3100" # Loki push/query API (also accepts native OTLP logs at /otlp/v1/logs)
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      # Same class of bug as Grafana's dashboards: local-config.yaml's default storage path is
      # /loki (chunks/index/wal), unmounted -- every container recreation silently threw away all
      # log history. This volume makes log history survive recreation the same way.
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.9.4
    container_name: observability-tempo
    ports:
      - "3200:3200" # Tempo query API, used by Grafana's Tempo datasource
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      # tempo.yaml's storage.trace.local.path/wal.path -- unmounted, trace history didn't survive
      # container recreation either. Same fix as loki-data above.
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: observability-prometheus
    ports:
      - "9090:9090" # Prometheus UI/API - http://localhost:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Prometheus's TSDB default path -- unmounted, metric history didn't survive container
      # recreation either. Same fix as loki-data/tempo-data above.
      - prometheus-data:/prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: observability-otel-collector
    ports:
      - "4317:4317" # OTLP gRPC - point OTEL_EXPORTER_OTLP_ENDPOINT here (grpc)
      - "4318:4318" # OTLP HTTP - point OTEL_EXPORTER_OTLP_ENDPOINT here (http/protobuf)
      - "8889:8889" # Prometheus-format metrics endpoint, scraped by the prometheus service above
      - "13133:13133" # health_check extension - GET / -> 200 once ready (scripts/observability/*.sh use this)
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  prometheus-data:

# docker-compose.yml's business services reach this stack's otel-collector by container DNS name
# (http://otel-collector:4317) -- that only resolves if both Compose projects' containers share
# an actual network, not just a host port mapping. `external: true` means this network must
# already exist; scripts/observability/up.sh and scripts/dev-up.sh both create it idempotently
# before either stack's `docker compose up` runs, so it's safe regardless of which one starts
# first (see docker-compose.yml's own networks: comment for the full story).
networks:
  default:
    name: kart-shared-net
    external: true
