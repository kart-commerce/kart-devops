    volumes:
      - ./compose/globalconfig/global.json:/app/globalconfig.json:ro
      - ./compose/globalconfig/logs/search:/var/log/kart/kart-search-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      product: { condition: service_started }

  inventory:
    build:
      context: ../kart-inventory-service
    container_name: kart-inventory
    ports:
      - "${INVENTORY_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GlobalConfig__Path: /app/globalconfig.json
      Observability__Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ./compose/globalconfig/global.json:/app/globalconfig.json:ro
      - ./compose/globalconfig/logs/inventory:/var/log/kart/kart-inventory-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity: { condition: service_started }

  cart:
    build:
      context: ..
      dockerfile: kart-cart-service/Dockerfile
    container_name: kart-cart
    ports:
      - "${CART_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GlobalConfig__Path: /app/globalconfig.json
      Observability__Otlp__Endpoint: http://otel-collector:4317
    volumes:
      - ./compose/globalconfig/global.json:/app/globalconfig.json:ro
      - ./compose/globalconfig/logs/cart:/var/log/kart/kart-cart-service
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      inventory: { condition: service_started }
